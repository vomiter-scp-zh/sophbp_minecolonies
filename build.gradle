plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation "curse.maven:minecolonies-245506:${minecolonies_file}"
    implementation "curse.maven:sophisticated-backpacks-422301:${backpacks_file}"
    implementation "curse.maven:sophisticated-core-618298:${core_file}"
    implementation "curse.maven:structurize-298744:9556249"
    implementation "curse.maven:blockui-522992:9137005"
    runtimeOnly "curse.maven:domum-ornamentum-527361:7789217"
    runtimeOnly "curse.maven:multi-piston-303278:7097877"
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: mod_version) }
}
